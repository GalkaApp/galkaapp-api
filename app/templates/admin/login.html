<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Sign in — Galka Admin</title>
<style>
  body { margin: 0; background: #FBFBFA; color: #1C1C1B;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; min-height: 100vh; }
  main { margin: auto; width: 100%; max-width: 340px; padding: 32px 24px; }
  .card { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 12px;
          padding: 28px 26px; }
  .logo { display: block; width: 56px; height: 56px; margin: 0 auto 14px; }
  h1 { font-size: 20px; letter-spacing: -.01em; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 11px; font-weight: 600; color: #ABABA8;
          text-transform: uppercase; letter-spacing: .04em; margin: 0 0 5px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 10px;
          border: 1px solid rgba(0,0,0,.14); border-radius: 8px; background: #FBFBFA; }
  input:focus { outline: none; border-color: #3B6FE0; background: #fff; }
  .field { margin-bottom: 14px; }
  button { width: 100%; margin-top: 8px; font: inherit; font-weight: 600; color: #fff;
           background: #3B6FE0; border: none; border-radius: 8px; padding: 10px;
           cursor: pointer; }
  button:hover { background: #2B55B8; }
  .error { background: rgba(192,104,94,.12); color: #A3564D; font-size: 13px;
           border-radius: 8px; padding: 9px 11px; margin: 0 0 16px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/static/icon.png" alt="Galka" width="56" height="56">
    <h1>Galka Admin</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/pu/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username"
               value="{{ username or '' }}" required {% if not username %}autofocus{% endif %}>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               required {% if username %}autofocus{% endif %}>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
