<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TodoApi Admin{% endblock %}</title>
<style>
  body { margin: 0; background: #FBFBFA; color: #1C1C1B;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { background: #F4F4F2; border-bottom: 1px solid rgba(0,0,0,.08);
           padding: 14px 28px; display: flex; align-items: baseline; gap: 16px; }
  header .brand { font-weight: 700; font-size: 15px; }
  header a { color: #3B6FE0; text-decoration: none; font-size: 13px; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px; }
  h1 { font-size: 22px; letter-spacing: -.01em; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 600; color: #ABABA8; text-transform: uppercase;
       letter-spacing: .05em; margin: 30px 0 10px; }
  .sub { color: #757572; font-size: 13px; margin-bottom: 20px; }
  table { border-collapse: collapse; width: 100%; background: #fff;
          border: 1px solid rgba(0,0,0,.08); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(0,0,0,.05);
           font-size: 13px; white-space: nowrap; }
  td.wrap { white-space: normal; }
  th { background: #F4F4F2; font-size: 11px; font-weight: 600; color: #757572;
       text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  a { color: #3B6FE0; text-decoration: none; }
  a:hover { color: #2B55B8; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: #ABABA8; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11.5px; }
  .pill.done { background: rgba(78,156,110,.14); color: #3E7D58; }
  .pill.open { background: rgba(59,111,224,.12); color: #2B55B8; }
  .pill.deleted { background: rgba(192,104,94,.14); color: #A3564D; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 6px; vertical-align: baseline; }
  .empty { color: #757572; padding: 28px 0; }
</style>
</head>
<body>
<header>
  <span class="brand">TodoApi</span>
  <a href="/admin">Users</a>
  <a href="/docs">API docs</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
