<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>{% block title %}Galka Admin{% endblock %}</title>
<style>
  body { margin: 0; background: #FBFBFA; color: #1C1C1B;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { background: #F4F4F2; border-bottom: 1px solid rgba(0,0,0,.08);
           padding: 12px 28px; display: flex; align-items: center; gap: 16px; }
  header .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  header .brand img { width: 32px; height: 32px; display: block; }
  header a { color: #3B6FE0; text-decoration: none; font-size: 13px; }
  header form { margin: 0 0 0 auto; display: flex; align-items: center; gap: 10px;
                color: #757572; font-size: 13px; }
  header button { font: inherit; color: #3B6FE0; background: none; border: none;
                  padding: 0; cursor: pointer; }
  header button:hover { color: #2B55B8; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px; }
  h1 { font-size: 22px; letter-spacing: -.01em; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 600; color: #ABABA8; text-transform: uppercase;
       letter-spacing: .05em; margin: 30px 0 10px; }
  .sub { color: #757572; font-size: 13px; margin-bottom: 20px; }
  table { border-collapse: collapse; width: 100%; background: #fff;
          border: 1px solid rgba(0,0,0,.08); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(0,0,0,.05);
           font-size: 13px; white-space: nowrap; }
  td.wrap { white-space: normal; }
  th { background: #F4F4F2; font-size: 11px; font-weight: 600; color: #757572;
       text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  a { color: #3B6FE0; text-decoration: none; }
  a:hover { color: #2B55B8; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: #ABABA8; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11.5px; }
  .pill.done { background: rgba(78,156,110,.14); color: #3E7D58; }
  .pill.open { background: rgba(59,111,224,.12); color: #2B55B8; }
  .pill.deleted { background: rgba(192,104,94,.14); color: #A3564D; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 6px; vertical-align: baseline; }
  .empty { color: #757572; padding: 28px 0; }
  form.inline button { font: inherit; font-size: 13px; color: #3B6FE0; background: #fff;
                       border: 1px solid rgba(0,0,0,.14); border-radius: 7px; padding: 5px 12px;
                       cursor: pointer; }
  form.inline button:disabled { color: #ABABA8; cursor: default; }
  form.edit { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
              padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
              gap: 12px 16px; align-items: end; margin-bottom: 12px; }
  form.edit label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600;
                    color: #757572; text-transform: uppercase; letter-spacing: .04em; }
  form.edit label.check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px;
                          text-transform: none; letter-spacing: 0; color: #1C1C1B; padding-bottom: 8px; }
  form.edit input:not([type=checkbox]), form.edit select {
      font: inherit; font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0;
      color: #1C1C1B; padding: 6px 8px; border: 1px solid rgba(0,0,0,.14); border-radius: 7px;
      background: #FBFBFA; }
  form.edit .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  button.primary { font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: #3B6FE0;
                   border: none; border-radius: 7px; padding: 6px 16px; cursor: pointer; }
  button.primary:hover { background: #2B55B8; }
  form.toggle { margin: 0; display: flex; align-items: center; gap: 8px; }
  form.toggle button { font: inherit; font-size: 11.5px; padding: 1px 9px; border-radius: 9px;
                       border: none; cursor: pointer; background: rgba(0,0,0,.06); color: #757572; }
  form.toggle button.on { background: rgba(78,156,110,.14); color: #3E7D58; }
  .flash { font-size: 13px; border-radius: 8px; padding: 8px 11px; margin: 0 0 14px; }
  .flash.ok { background: rgba(78,156,110,.12); color: #3E7D58; }
  .flash.err { background: rgba(192,104,94,.12); color: #A3564D; }
</style>
</head>
<body>
<header>
  <span class="brand"><img src="/static/icon.png" alt="" width="32" height="32">Galka</span>
  <a href="/pu">Users</a>
  <a href="/docs">API docs</a>
  <form method="post" action="/pu/logout">{{ admin }}<button type="submit">Sign out</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
